  <circle cx="54" cy="35" r="5" fill="#d3d3d3"/>
  <circle cx="73" cy="35" r="5" fill="#d4d4d4"/>
  <text x="98" y="41" fill="#929292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Jermy061  ·  profile shell  ·  online</text>
  <path d="M29 58H931" stroke="#353535"/>

  <rect x="29" y="78" width="594" height="271" rx="9" fill="#1d1d1d" stroke="#a7a7a7" stroke-width="1.5"/>
