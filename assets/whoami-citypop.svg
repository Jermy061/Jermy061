  <text x="231" y="143" fill="#d5d5d5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Full Stack Developer</text>

  <path d="M48 166H604" stroke="#353535"/>
  <text x="48" y="196" fill="#929292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">context:</text>
