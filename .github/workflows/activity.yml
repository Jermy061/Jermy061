name: Actualizar gráfico de actividad
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity_graph.py
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: activity-graph
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar gráfico con datos de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/activity_graph.py
      - name: Guardar gráfico actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar gráfico de actividad"
          git pull --rebase origin main
          git push origin HEAD:main
