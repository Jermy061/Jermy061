name: generar grafico de actividad

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity_graph.py ${{ github.repository_owner }}

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --staged --quiet || git commit -m "Actualizar grafico de actividad"
          git push
