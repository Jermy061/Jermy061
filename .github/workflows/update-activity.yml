name: Actualizar gráfico de actividad de GitHub

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar gráfico desde GitHub GraphQL
        env:
          GH_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
          GITHUB_USERNAME: Jermy061
        run: node scripts/update-activity.mjs

      - name: Guardar gráfico actualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then
            echo 'El gráfico no cambió.'
          else
            git commit -m 'chore: actualizar gráfico de actividad'
            git push
          fi
