name: generar serpiente

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generar la animación
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E8B04B&color_dots=#161616,#3a3a3e,#6b6b70,#a8a8ad,#E8B04B
            dist/snake-dark.svg?color_snake=#E8B04B&color_dots=#161616,#3a3a3e,#6b6b70,#a8a8ad,#E8B04B

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
